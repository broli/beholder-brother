[package]
name = "beholder-brother"
version = "0.2.1-alpha"
edition = "2024"
authors = ["Carlos Ferrabone <152314+broli@users.noreply.github.com>"]
description = "Lightweight Linux system telemetry daemon and HTML/SVG log viewer"
license = "MIT"
repository = "https://github.com/broli/beholder-brother"
default-run = "beholder"

[[bin]]
name = "beholder"
path = "src/bin/beholder.rs"

[[bin]]
name = "brother"
path = "src/bin/brother.rs"

[dependencies]
lexopt = "0.3.2"
ctrlc = { version = "3.5.1", features = ["termination"] }
nix = { version = "0.31", features = ["fs"] }
tiny_http = "0.12"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
time = { version = "0.3", default-features = false, features = [
    "formatting",
    "macros",
    "parsing",
] }

[package.metadata.deb]
depends = ""

[profile.release]
strip = true

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/beholder", dest = "/usr/bin/beholder", mode = "755" },
    { source = "target/release/brother", dest = "/usr/bin/brother", mode = "755" },
]
